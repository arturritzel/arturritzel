# https://github.com/stats-organization/github-readme-stats-action

name: Cards do README

# Gera os cards como SVG estatico e commita no proprio repositorio,
# em vez de depender de uma instancia publica no ar a cada visita.
on:
  schedule:
    - cron: "0 3 * * *" # todo dia, 3h UTC

  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

    # Usa o PAT_STATS quando o secret existir, que e o que permite contar
    # repositorio privado. Sem ele, cai no GITHUB_TOKEN e gera so dado publico.
      - name: Gera o card de estatisticas
        uses: stats-organization/github-readme-stats-action@e856fc8de9d7729b463c468911e232cfbdc3d55e # v2.0.2
        with:
          card: stats
          options: username=${{ github.repository_owner }}&rank_icon=github&theme=dracula&title_color=a7dbb5&border_color=a7dbb5&include_all_commits=true&count_private=true
          path: profile/stats.svg
          token: ${{ secrets.PAT_STATS || secrets.GITHUB_TOKEN }}
          fail_on_error: "true"

      - name: Gera o card de linguagens
        uses: stats-organization/github-readme-stats-action@e856fc8de9d7729b463c468911e232cfbdc3d55e # v2.0.2
        with:
          card: top-langs
          options: username=${{ github.repository_owner }}&layout=compact&theme=dracula&title_color=a7dbb5&border_color=a7dbb5
          path: profile/top-langs.svg
          token: ${{ secrets.PAT_STATS || secrets.GITHUB_TOKEN }}
          fail_on_error: "true"

    # So chega aqui se os dois cards foram gerados sem erro, entao um
    # rate limit preserva os cards antigos em vez de commitar card quebrado.
      - name: Commita os cards
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile/*.svg
          git commit -m "Atualiza os cards do README" || exit 0
          git push
